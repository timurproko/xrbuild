<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; frame-src 'self'; base-uri 'none'; form-action 'none'">
  <title>XR Build · Design</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/design-system.css">
  <link rel="stylesheet" href="/design-system/gallery.css">
  <script type="module" src="/design-system/gallery.js"></script>
</head>
<body class="design-gallery">
  <header class="xrb-app-bar design-toolbar">
    <h1 class="xrb-brand">XR Build <button id="panel-menu-button" class="xrb-product-menu" type="button" aria-haspopup="menu" aria-expanded="false">Design</button></h1>
    <div class="design-case-picker"><select id="case" aria-label="Design case"><option value="main">Main</option></select></div>
  </header>
  <div id="panel-menu" class="menu panel-menu" role="menu" hidden></div>
  <div class="design-layout">
    <nav id="states" aria-label="Case scenarios"></nav>
    <main class="design-stage"><iframe id="preview" title="Install dependencies preview" sandbox="allow-scripts allow-same-origin"></iframe></main>
  </div>
</body>
</html>
