<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XR Build · Hands</title>
  <script src="/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" data-xrb-fonts href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/design-system.css">
  <link rel="stylesheet" href="/hands.css">
  <script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/controls/OrbitControls.js":"/vendor/OrbitControls.js"}}</script>
</head>
<body class="hands-page">
  <header class="xrb-app-bar xrb-app-bar--wrap">
    <h1 class="xrb-brand">XR Build <button id="hands-menu-button" class="xrb-product-menu" type="button" aria-haspopup="menu" aria-expanded="false">Hands</button></h1>
    <span id="panel-chip" class="chip warn" data-maintenance="restart" hidden>restart</span>
    <span id="host-chip" class="chip" data-maintenance="rebuild" hidden>rebuild</span>
    <span id="update-chip" class="chip update" data-maintenance="update" hidden>update</span>
    <div id="hands-header-status" class="hands-header-status"><span id="hands-live-state" class="chip" role="status">Not started</span></div>
    <span class="spacer"></span>
    <div class="row" aria-label="Hands frame rates">
      <span class="chip" data-tooltip="Viewport render rate"><span id="hands-render-fps">—</span><small>render fps</small></span>
      <span class="chip" data-tooltip="No live hand session"><span id="hands-tracking-fps">—</span><small>hand tracking fps</small></span>
    </div>
  </header>
  <main id="hands-workspace" class="xrb-workspace-layout" aria-label="Hands workspace">
    <section id="hands-viewport" class="xrb-card hands-viewport" aria-label="3D hand view">
      <canvas id="hands-canvas" aria-label="Shared SDK hand view"></canvas>
      <div class="hands-view-tools xrb-controls-small">
        <!-- Present and disabled from the first paint; live controls adopt it once loaded. -->
        <div id="hands-session-actions" class="hands-session-actions"><button type="button" id="hands-start-stop" class="primary" disabled>Start</button></div>
        <span class="hands-tool-separator" aria-hidden="true"></span>
        <div class="dropdown" data-multi="true" data-summary="View" data-options="grid|axes|monitor|object" data-labels='{"grid":"Grid","axes":"Axes","monitor":"Monitor","object":"Object"}'>
          <input id="hands-view-options" type="hidden" value='["grid","axes","monitor","object"]'>
          <button type="button" class="dropdown-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="View options" data-no-tooltip>View</button>
        </div>
        <button id="hands-view-reset" type="button" aria-label="Reset view" data-no-tooltip>Reset</button>
        <span class="spacer"></span>
        <button id="hands-fullscreen" type="button" class="xrb-icon-button" data-xrb-icon="fullscreen" aria-label="Enter fullscreen" data-no-tooltip></button>
      </div>
      <p id="hands-view-error" class="field-error hands-view-error" role="alert" hidden></p>
    </section>
    <section class="xrb-card hands-panel" aria-label="Hand setup and adjustments">
      <!-- Present from the first paint; the adjustment editor adopts these tabs when it loads. -->
      <div class="xrb-tabs hands-adjustment-tabs" role="tablist" aria-label="Hand adjustments" data-xrb-tabs-id="hands-adjustments">
        <button type="button" class="xrb-tab" role="tab" data-tab="setup" aria-selected="true" tabindex="0">Setup</button>
        <button type="button" class="xrb-tab" role="tab" data-tab="geometry" aria-selected="false" tabindex="-1">Position</button>
        <button type="button" class="xrb-tab" role="tab" data-tab="appearance" aria-selected="false" tabindex="-1">Visual</button>
        <button type="button" class="xrb-tab" role="tab" data-tab="log" aria-selected="false" tabindex="-1">Log</button>
      </div>
      <div id="hands-setup" class="xrb-sidebar-content xrb-stack hands-source">
        <form id="hands-form" class="xrb-stack">
          <label class="xrb-field-label" for="hands-provider">Skeleton provider<select id="hands-provider" name="provider" aria-label="Skeleton provider" disabled></select></label>
          <label class="xrb-field-label" for="hands-monitor">Monitor<select id="hands-monitor" aria-label="Monitor" disabled><option value="">None</option></select></label>
          <label class="xrb-field-label" for="hands-object">Object<select id="hands-object" aria-label="Object"><option value="cube">Cube</option><option value="sphere">Sphere</option><option value="suzanne">Suzanne</option></select></label>
          <div class="xrb-field-label">Object X (mm)<span class="hands-number-row"><input type="number" id="hands-object-x" data-object-axis="x" aria-label="Object X (mm)" min="-300" max="300" step="1"><input class="xrb-range" type="range" id="hands-object-x-range" data-object-axis="x" aria-label="Object X slider" min="-300" max="300" step="1"></span></div>
          <div class="xrb-field-label">Object Y (mm)<span class="hands-number-row"><input type="number" id="hands-object-y" data-object-axis="y" aria-label="Object Y (mm)" min="-300" max="300" step="1"><input class="xrb-range" type="range" id="hands-object-y-range" data-object-axis="y" aria-label="Object Y slider" min="-300" max="300" step="1"></span></div>
          <div class="xrb-field-label">Object Z (mm)<span class="hands-number-row"><input type="number" id="hands-object-z" data-object-axis="z" aria-label="Object Z (mm)" min="-300" max="300" step="1"><input class="xrb-range" type="range" id="hands-object-z-range" data-object-axis="z" aria-label="Object Z slider" min="-300" max="300" step="1"></span></div>
          <div class="xrb-field-label">Grid<span class="hands-number-row"><input type="number" id="hands-grid-opacity" aria-label="Grid opacity" min="0" max="1" step="0.01"><input class="xrb-range" type="range" id="hands-grid-opacity-range" aria-label="Grid opacity slider" min="0" max="1" step="0.01"><span class="xrb-inline-icons"><button type="button" id="hands-grid-color" class="xrb-swatch" aria-label="Choose grid color" aria-haspopup="dialog"></button></span></span></div>
        </form>
        <p id="hands-message" class="field-error" role="alert" hidden></p>
        <div class="xrb-button-row" id="hands-source-recovery" hidden><button id="hands-source-retry" class="small" type="button">Retry</button><button id="hands-source-discard" class="small" type="button" hidden>Use saved</button></div>
        <div id="hands-postprocessing-root" hidden></div>
      </div>
      <div id="hands-log-panel" class="xrb-sidebar-content xrb-stack" data-tab-panel="log" hidden>
        <div id="hands-log-empty" class="empty-note">No log entries yet.</div>
        <pre id="hands-log" class="log" aria-label="Hands log" hidden></pre>
      </div>
      <div id="hands-adjustments-root" class="xrb-sidebar-content xrb-stack" hidden></div>
    </section>
  </main>
  <div id="hands-menu" class="menu xrb-menu panel-menu" role="menu" aria-label="XR Build navigation" hidden></div>
  <script type="module" src="/hands.js"></script>
</body>
</html>
