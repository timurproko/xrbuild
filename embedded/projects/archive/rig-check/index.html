<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rig check</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f14; overflow: hidden; cursor: default; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<p id="capability" style="position:fixed;bottom:0;z-index:1;color:#c8d0d8;background:#0b0f14;font:14px system-ui">Archived diagnostic: a compatible host/provider must be selected explicitly. No capture starts from this page.</p>
<canvas id="c"></canvas>
<script>
// Interactive stage 1 rig check. Everything is drawn into both eye halves so it is
// seen in 3D; questions are answered by clicking Yes / No with the mouse.
// Answers and measurements are logged as RIG-* lines (they land in the host log).
const host = window.__XRB_HOST__;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[0,17],[17,18],[18,19],[19,20]];
const TARGETS = [[0, 0], [-0.2, 0.1], [0.2, 0.1], [0.2, -0.1], [-0.2, -0.1]];
const HOLD_MS = 7000, SAMPLE_MS = 2500;

// ---- live data from the host channel
let eyes = null, hands = [], trackingHz = 0, handStatus = 'waiting for hand tracking...';
const handLatency = [];
let fps = 0, fpsFrames = 0, fpsSince = performance.now();
const trace = [];
if (host) {
  const ws = new WebSocket(host.channel.url);
  ws.binaryType = 'arraybuffer';
  ws.onmessage = (e) => {
    if (!(e.data instanceof ArrayBuffer) || e.data.byteLength < 41) return;
    const bounds = new DataView(e.data);
    if (bounds.getUint8(0) === 2 && e.data.byteLength < 32 + bounds.getUint8(28) * 456) return;
    if (bounds.getUint8(0) === 3 && e.data.byteLength < 26 + bounds.getUint16(24, true)) return;
    const v = new DataView(e.data), type = v.getUint8(0);
    if (type === 1) {
      const f = (i) => v.getFloat32(16 + i * 4, true);
      eyes = { l: [f(0), f(1), f(2)], r: [f(3), f(4), f(5)], stale: v.getUint8(40) === 1 };
      trace.push([performance.now(), (eyes.l[0] + eyes.r[0]) / 2]);
      while (trace.length && trace[0][0] < performance.now() - 8000) trace.shift();
    } else if (type === 2) {
      trackingHz = v.getFloat32(24, true);
      handLatency.push(host.hostNow() - v.getFloat64(16, true));
      if (handLatency.length > 120) handLatency.shift();
      const n = v.getUint8(28);
      hands = [];
      for (let h = 0; h < n; h++) {
        const b = 32 + h * 456, kp = [];
        for (let k = 0; k < 21; k++) { const o = b + 12 + k * 16; kp.push([v.getFloat32(o, true), v.getFloat32(o + 4, true), v.getFloat32(o + 8, true)]); }
        hands.push({ id: v.getInt32(b, true), handedness: v.getInt8(b + 4), grab: (v.getUint8(b + 5) & 1) === 1, pinch: v.getUint8(b + 6) === 1, kp });
      }
      onHands();
    } else if (type === 3) {
      handStatus = new TextDecoder().decode(new Uint8Array(e.data, 26, v.getUint16(24, true)));
    }
  };
}

// ---- steps
const answers = {};
const STEPS = [
  { id: 'depth', title: '1/5  3D picture',
    text: ['Look at the picture.', 'Does the ORANGE square float IN FRONT of the screen,', 'and the BLUE square sit BEHIND it?'], draw: drawDepth },
  { id: 'head', title: '2/5  Head tracking',
    text: ['Move your head slowly left and right (about 5 cm).', 'Does the green dot follow your head?'], draw: drawHead },
  { id: 'hands', title: '3/5  Hands',
    text: ['Hold one hand, then both, 20-40 cm in front of the display.', 'Does the skeleton follow your hand?'], draw: drawHands },
  { id: 'pinch', title: '4/5  Pinch',
    text: ['Pinch thumb and index finger together.', 'Does the hand turn ORANGE while you pinch?'], draw: drawHands },
  { id: 'touch', title: '5/5  Touch the glass', auto: true,
    text: ['Touch the ORANGE target on the glass with your index fingertip', 'and hold still until the next one turns orange.'], draw: drawTouch },
];
let step = 0, touchIndex = -1, touchStart = 0, touchSamples = [], touchResults = [];
let buttons = [];  // [{x,y,w,h,label,onClick}] in eye pixels

function answer(value) {
  const s = STEPS[step];
  answers[s.id] = value;
  console.log(`RIG-ANSWER ${s.id} ${value}`);
  next();
}
function next() {
  step++;
  if (STEPS[step]?.id === 'touch') { touchIndex = 0; touchStart = performance.now(); }
  if (step >= STEPS.length) finish();
}
function finish() {
  console.log(`RIG-DONE ${JSON.stringify({ answers, touch: touchResults, trackingHz })}`);
}

// ---- touch measurement
const median = (a) => { const s = [...a].sort((x, y) => x - y); return s.length ? s[Math.floor(s.length / 2)] : NaN; };
function onHands() {
  if (STEPS[step]?.id !== 'touch' || touchIndex < 0 || !hands.length) return;
  if (performance.now() - touchStart < HOLD_MS - SAMPLE_MS) return;
  const [tx, ty] = TARGETS[touchIndex];
  const tip = hands.map((h) => h.kp[8]).reduce((a, b) => (Math.hypot(a[0] - tx, a[1] - ty) < Math.hypot(b[0] - tx, b[1] - ty) ? a : b));
  touchSamples.push(tip);
}
function updateTouch() {
  if (!hands.length || STEPS[step]?.id !== 'touch' || touchIndex < 0 || performance.now() - touchStart < HOLD_MS) return;
  const [tx, ty] = TARGETS[touchIndex];
  const m = [0, 1, 2].map((i) => median(touchSamples.map((s) => s[i])));
  const r = { target: touchIndex, targetM: [tx, ty], fingertipM: m, errorXcm: (m[0] - tx) * 100, errorYcm: (m[1] - ty) * 100, zcm: m[2] * 100, samples: touchSamples.length };
  touchResults.push(r);
  console.log(`TOUCH-RESULT ${JSON.stringify(r)}`);
  touchSamples = [];
  touchIndex++;
  touchStart = performance.now();
  if (touchIndex >= TARGETS.length) {
    const ok = touchResults.filter((t) => t.samples > 0);
    const err = ok.map((t) => Math.hypot(t.errorXcm, t.errorYcm));
    const avg = (a) => a.reduce((x, y) => x + y, 0) / Math.max(1, a.length);
    console.log(`TOUCH-SUMMARY ${JSON.stringify({ measured: ok.length, meanXcm: avg(ok.map((t) => t.errorXcm)), meanYcm: avg(ok.map((t) => t.errorYcm)),
      meanZcm: avg(ok.map((t) => t.zcm)), meanErrorCm: avg(err), maxErrorCm: err.length ? Math.max(...err) : null })}`);
    touchIndex = -1;
    next();
  }
}

// ---- drawing helpers (eye-local coordinates)
let EW = 0, EH = 0;
const panel = () => host?.display ?? { widthM: 0.597, heightM: 0.336 };
const toPx = (x, y) => [EW / 2 + x * EW / panel().widthM, EH / 2 - y * EH / panel().heightM];

function drawDepth(eye) {
  const shift = (d) => -eye * d * EW / 400;
  ctx.strokeStyle = '#3a4a5a'; ctx.lineWidth = Math.max(1, EW / 960);
  for (let x = 0; x <= EW; x += EW / 16) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, EH); ctx.stroke(); }
  for (let y = 0; y <= EH; y += EW / 16) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(EW, y); ctx.stroke(); }
  const s = EW / 7;
  ctx.fillStyle = '#2f6fdf'; ctx.fillRect(EW * 0.66 - s / 2 + shift(-4), EH * 0.45 - s / 2, s, s);
  ctx.fillStyle = '#f08a24'; ctx.fillRect(EW * 0.34 - s / 2 + shift(4), EH * 0.45 - s / 2, s, s);
}
function drawHead() {
  // A dot where your head is, seen from the display: it should move left/right
  // (and up/down) with your head. The dashed line marks the display centre.
  ctx.strokeStyle = '#2a3542'; ctx.lineWidth = 2; ctx.setLineDash([10, 10]);
  ctx.beginPath(); ctx.moveTo(EW / 2, EH * 0.22); ctx.lineTo(EW / 2, EH * 0.8); ctx.stroke(); ctx.setLineDash([]);
  if (!eyes) { label('waiting for head tracking...', EH * 0.5); return; }
  const hx = (eyes.l[0] + eyes.r[0]) / 2, hy = (eyes.l[1] + eyes.r[1]) / 2, hz = (eyes.l[2] + eyes.r[2]) / 2;
  const [px, py] = toPx(hx * 2, hy - 0.12);  // doubled sideways so 5 cm is easy to see
  ctx.fillStyle = eyes.stale ? '#d9534f' : '#5bd18b';
  ctx.beginPath(); ctx.arc(px, Math.min(EH * 0.78, Math.max(EH * 0.25, py)), EW / 40, 0, Math.PI * 2); ctx.fill();
  label(`head ${(hx * 100).toFixed(1)} cm ${hx < 0 ? 'left' : 'right'} of centre, ${(hz * 100).toFixed(0)} cm away`, EH * 0.82);
}
function drawHands(eye) {
  const px = ([x, y, z]) => { const [a, b] = toPx(x, y); return [a - eye * z * (EW / panel().widthM) * 0.06, b]; };
  for (const h of hands) {
    const color = h.pinch ? '#f08a24' : h.grab ? '#f0c419' : '#5b9bd1';
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = Math.max(3, EW / 400);
    for (const [a, b] of BONES) { const [ax, ay] = px(h.kp[a]), [bx, by] = px(h.kp[b]); ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke(); }
    for (const k of h.kp) { const [x, y] = px(k); ctx.beginPath(); ctx.arc(x, y, EW / 220, 0, Math.PI * 2); ctx.fill(); }
  }
  label(`${hands.length} hand(s), tracking ${trackingHz.toFixed(0)} Hz  -  ${handStatus}`, EH * 0.75);
}
function drawTouch() {
  TARGETS.forEach(([x, y], i) => {
    const [px, py] = toPx(x, y), active = i === touchIndex;
    ctx.strokeStyle = active ? '#f08a24' : i < touchIndex ? '#3b7a52' : '#2a3542';
    ctx.lineWidth = active ? EW / 250 : EW / 600;
    ctx.beginPath(); ctx.arc(px, py, EW / 40, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px - EW / 25, py); ctx.lineTo(px + EW / 25, py); ctx.moveTo(px, py - EW / 25); ctx.lineTo(px, py + EW / 25); ctx.stroke();
  });
  for (const h of hands) { const [x, y] = toPx(h.kp[8][0], h.kp[8][1]); ctx.fillStyle = '#5bd18b'; ctx.beginPath(); ctx.arc(x, y, EW / 120, 0, Math.PI * 2); ctx.fill(); }
  if (touchIndex >= 0) label(`target ${touchIndex + 1}/5 - ${Math.max(0, Math.ceil((HOLD_MS - (performance.now() - touchStart)) / 1000))} s`, EH * 0.9);
}
// Stats bar along the bottom of each eye.
function drawStats() {
  const lat = [...handLatency].sort((a, b) => a - b);
  const p50 = lat.length ? lat[Math.floor(lat.length / 2)].toFixed(0) : '-';
  const head = eyes ? `${(((eyes.l[2] + eyes.r[2]) / 2) * 100).toFixed(0)} cm${eyes.stale ? ' (lost)' : ''}` : '-';
  const text = `page ${fps.toFixed(0)} fps   |   hands ${trackingHz.toFixed(0)} Hz, ${hands.length} hand(s), camera->page ${p50} ms   |   head ${head}`;
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, EH - EH * 0.045, EW, EH * 0.045);
  ctx.fillStyle = '#9fb0c0'; ctx.font = `${Math.round(EW / 75)}px ui-monospace, Consolas, monospace`; ctx.textAlign = 'center';
  ctx.fillText(text, EW / 2, EH - EH * 0.013); ctx.textAlign = 'left';
}
function label(text, y) {
  ctx.fillStyle = '#c8d0d8'; ctx.font = `${Math.round(EW / 55)}px system-ui`; ctx.textAlign = 'center'; ctx.fillText(text, EW / 2, y); ctx.textAlign = 'left';
}
function drawPanel(s) {
  ctx.fillStyle = 'rgba(11,15,20,0.85)'; ctx.fillRect(0, 0, EW, EH * 0.2);
  ctx.fillStyle = '#ffffff'; ctx.font = `bold ${Math.round(EW / 40)}px system-ui`; ctx.fillText(s.title, EW * 0.03, EH * 0.06);
  ctx.font = `${Math.round(EW / 55)}px system-ui`; ctx.fillStyle = '#c8d0d8';
  s.text.forEach((t, i) => ctx.fillText(t, EW * 0.03, EH * 0.105 + i * EW / 45));
  buttons = [];
  if (!s.auto) {
    const bw = EW * 0.12, bh = EH * 0.08, y = EH * 0.84;
    buttons.push({ x: EW * 0.33 - bw / 2, y, w: bw, h: bh, label: 'Yes', color: '#2e7d4f', onClick: () => answer('yes') });
    buttons.push({ x: EW * 0.67 - bw / 2, y, w: bw, h: bh, label: 'No', color: '#8a2f2f', onClick: () => answer('no') });
  }
  buttons.forEach(drawButton);
}
// Buttons brighten and get an outline under the cursor, and flash when clicked.
let flash = null;
const inside = (b, p) => p && p[0] >= b.x && p[0] <= b.x + b.w && p[1] >= b.y && p[1] <= b.y + b.h;
function drawButton(b) {
  const hover = inside(b, mouse), pressed = flash && flash.label === b.label && performance.now() - flash.t < 250;
  const grow = hover ? EW / 200 : 0;
  ctx.globalAlpha = 1;
  ctx.fillStyle = pressed ? '#ffffff' : b.color;
  ctx.fillRect(b.x - grow, b.y - grow, b.w + grow * 2, b.h + grow * 2);
  if (hover && !pressed) { ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(b.x - grow, b.y - grow, b.w + grow * 2, b.h + grow * 2); }
  if (hover) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(3, EW / 300); ctx.strokeRect(b.x - grow, b.y - grow, b.w + grow * 2, b.h + grow * 2); }
  ctx.fillStyle = pressed ? '#000' : '#fff'; ctx.font = `bold ${Math.round(EW / 40)}px system-ui`; ctx.textAlign = 'center';
  ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h * 0.68); ctx.textAlign = 'left';
}

function drawDone() {
  ctx.fillStyle = '#ffffff'; ctx.font = `bold ${Math.round(EW / 30)}px system-ui`; ctx.textAlign = 'center';
  ctx.fillText('All done - thank you!', EW / 2, EH * 0.35);
  ctx.font = `${Math.round(EW / 55)}px system-ui`; ctx.fillStyle = '#c8d0d8';
  ctx.fillText('Click Close, then start another 3D app once to check the display still works.', EW / 2, EH * 0.45);
  ctx.textAlign = 'left';
  const bw = EW * 0.14, bh = EH * 0.08;
  buttons = [{ x: EW / 2 - bw / 2, y: EH * 0.6, w: bw, h: bh, label: 'Close', color: '#3a4a5a', onClick: () => window.close() }];
  buttons.forEach(drawButton);
}

// The host hides the system cursor on a 3D display; draw one at the mouse position in
// both eye halves so it appears exactly where clicks land.
let mouse = null;
// Page x spans both eyes: position on the panel = clientX / page width.
canvas.addEventListener('mousemove', (e) => { mouse = [e.clientX * EW / canvas.width, e.clientY]; });
function drawCursor() {
  if (!mouse || !host?.stereo) return;
  const [x, y] = mouse, s = EW / 60;
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#000000'; ctx.lineWidth = Math.max(2, EW / 800);
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + s); ctx.lineTo(x + s * 0.28, y + s * 0.75); ctx.lineTo(x + s * 0.7, y + s * 0.7); ctx.closePath();
  ctx.fill(); ctx.stroke();
}

// Clicks arrive in left-eye page pixels; every eye half has the same layout.
canvas.addEventListener('click', (e) => {
  const x = e.clientX * EW / canvas.width, y = e.clientY;
  const b = buttons.find((b) => inside(b, [x, y]));
  if (b && !(flash && performance.now() - flash.t < 300)) { flash = { label: b.label, t: performance.now() }; setTimeout(b.onClick, 200); }
});

function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

function frame() {
  fpsFrames++;
  const now = performance.now();
  if (now - fpsSince >= 1000) { fps = fpsFrames * 1000 / (now - fpsSince); fpsFrames = 0; fpsSince = now; }
  updateTouch();
  const stereo = host?.stereo;
  EW = stereo ? canvas.width / 2 : canvas.width; EH = canvas.height;
  for (const eye of stereo ? [-1, 1] : [0]) {
    ctx.save();
    ctx.translate(eye === 1 ? EW : 0, 0);
    ctx.beginPath(); ctx.rect(0, 0, EW, EH); ctx.clip();
    ctx.fillStyle = '#0b0f14'; ctx.fillRect(0, 0, EW, EH);
    if (step < STEPS.length) { STEPS[step].draw(eye); drawPanel(STEPS[step]); } else drawDone();
    drawStats();
    drawCursor();
    ctx.restore();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
