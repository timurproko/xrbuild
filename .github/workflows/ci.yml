name: CI

# Every PR to main runs the checks its changes need; "CI required" collects them and is the one check the main ruleset
# requires. A draft runs only the light jobs; marking it ready runs the rest. Body/title edits and label changes do
# not restart CI. Pushes to main run the fast jobs; the nightly schedule and explicit dispatch also build and test
# the native host. Delivery
# rules are not checked here: the shared Delivery workflow publishes its own check.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its older run; runs on main (push, nightly, dispatch) each get their own group, so every
# commit on main is checked to the end.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  readiness:
    name: Readiness
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - id: ready
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ "$DRAFT" = "true" ]; then ready=false; else ready=true; fi
          echo "ready=$ready" | tee -a "$GITHUB_OUTPUT"

  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.select.outputs.node }}
      embedded: ${{ steps.select.outputs.embedded }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"; echo "embedded=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE...$HEAD")
          echo "$files"
          # A change to CI itself selects all PR-eligible jobs; the host lane remains nightly/manual.
          match() { echo "$files" | grep -qE "$1" && echo true || echo false; }
          echo "node=$(match '^(packages/|tools/|templates/|embedded/|native/plugin-sdk/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig\.json$|\.github/)')" >> "$GITHUB_OUTPUT"
          echo "embedded=$(match '^(embedded/|native/host/|native/plugin-sdk/|packages/(control-panel|desktop-package|sdk|ui-kit|app-icon)/|tools/(embedded|fetch-deps)/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig\.json$|\.github/)')" >> "$GITHUB_OUTPUT"

  names:
    name: Name guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node tools/name-guard/name-guard.mjs check

  openspec:
    name: OpenSpec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The shared delivery workflow pins the one OpenSpec version; this runs that version, the same as finalization.
      - uses: timurproko/MyWorkflows/actions/openspec@main

  node:
    name: Node tests
    needs: [readiness, changes]
    if: needs.readiness.outputs.ready == 'true' && needs.changes.outputs.node == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # The shared delivery workflow: the pr-automation tests validate OpenSpec scaffolds with the version it pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: timurproko/MyWorkflows
          ref: main
          path: .artifacts/workflow
          persist-credentials: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:types
      # --no-bail: every suite reports, not only the first that fails.
      - run: pnpm -r --no-bail --if-present test
        env:
          XRB_WORKFLOW_HOME: ${{ github.workspace }}/.artifacts/workflow
      # Separate public workspace; frozen installs/builds/tests stay in the job-owned cache.
      - run: pnpm test:embedded --if-present --workspace=.artifacts/embedded-ci

  embedded:
    name: Embedded public boundaries
    needs: [readiness, changes]
    if: needs.readiness.outputs.ready == 'true' && needs.changes.outputs.embedded == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check:types
      - run: pnpm test:embedded --workspace=.artifacts/embedded-boundary-ci
      # Compiles both synthetic origins against the public ABI header without CEF, devices or private assets.
      - run: node --test --test-concurrency=1 packages/control-panel/test/native-build.fixture.ts packages/control-panel/test/embedded-workflows.fixture.ts packages/control-panel/test/service-artifacts.test.ts packages/control-panel/test/package-staging.test.ts packages/control-panel/test/project-provider-settings.test.ts packages/control-panel/test/cache-maintenance.test.ts

  native:
    name: Host build and tests
    needs: [readiness]
    # Deliberately skip every PR and main push; a dispatch can check a sensitive change before merge.
    if: needs.readiness.outputs.ready == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/*
            !third_party/README.md
          key: third-party-${{ hashFiles('tools/fetch-deps/deps.lock.json', 'tools/fetch-deps/sources.mjs') }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node tools/fetch-deps/fetch-deps.mjs
      # Same user-cache path as installed-product consumers; no source-local host build or private workspace.
      - run: pnpm host --workspace=.artifacts/native-ci --core-only --tests
      - run: pnpm host --workspace=.artifacts/native-ci --plugins-only

  required:
    name: CI required
    # Still collect failed needs, but never publish a failure for a cancelled/superseded run.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    needs: [readiness, changes, names, openspec, node, embedded, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: node tools/pr-automation/required.mjs
