name: Ready pull-request refresh

# Run trusted main policy, never a candidate head or workflow_run artifacts. The completion bridge is dormant
# while Docs auto-merge is disabled; it does not enable that workflow. Duplicate passes are idempotent.
on:
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_run:
    workflows: [Docs auto-merge]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ready-pull-request-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh stale ready pull requests
    if: >-
      github.event.repository.default_branch == 'main' &&
      (github.event_name == 'workflow_run' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted default-branch policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Mint the scoped event-producing App identity
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.XRB_BOT_APP_ID }}
          private-key: ${{ secrets.XRB_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Refresh stale ready branches against current main
        env:
          BRANCH_REFRESH_TOKEN: ${{ steps.app.outputs.token }}
        run: node tools/pr-automation/refresh-ready-pull-requests.mjs
