name: OpenSpec finalization

# Only main's policy executes. PR-head files are data, never installed or run with the App token.
on:
  pull_request_target:
    branches: [main]
    types: [opened, ready_for_review, synchronize, reopened, edited, converted_to_draft, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to inspect or reconcile
        required: true
      dry_run:
        description: Inspect without readiness, branch or body mutations
        type: boolean
        default: true

permissions: {}
concurrency:
  group: openspec-finalization-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  promote:
    name: Inspect completed draft
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.body, 'openspec-implementation'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out main's scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base
          persist-credentials: false
      - id: candidate
        name: Resolve immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || exit 1
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          [[ "$head" =~ ^[a-f0-9]{40}$ ]] || exit 1
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - name: Check out exact PR head as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.head }}
          path: head
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: inspect
        name: Inspect with read-only credentials
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: node base/tools/pr-automation/promote.mjs --repo head --pr "$PR" --inspect
      - id: bot
        if: steps.inspect.outputs.status == 'complete' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
        uses: ./base/.github/actions/app-token
        with:
          app-id: ${{ vars.XRB_BOT_APP_ID }}
          private-key: ${{ secrets.XRB_BOT_PRIVATE_KEY }}
      - name: Recheck and promote with event-producing identity
        if: steps.inspect.outputs.status == 'complete' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: node base/tools/pr-automation/promote.mjs --repo head --pr "$PR"

  finalize:
    name: Finalize
    if: >-
      (github.event_name == 'workflow_dispatch' && !inputs.dry_run) ||
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft &&
       !contains(github.event.pull_request.labels.*.name, 'delivery-hold') &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.body, 'openspec-implementation'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out main's scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base
          persist-credentials: false
      - id: bot
        uses: ./base/.github/actions/app-token
        with:
          app-id: ${{ vars.XRB_BOT_APP_ID }}
          private-key: ${{ secrets.XRB_BOT_PRIVATE_KEY }}
      - id: pr
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || exit 1
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "ref=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.ref)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: base/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install pinned trusted tooling without lifecycle scripts
        working-directory: base
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @xr-build/pr-automation
      - name: Check out the PR branch as the App
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.ref }}
          path: head
          token: ${{ steps.bot.outputs.token }}
      - name: Finalize exact candidate
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          AUTHOR: ${{ steps.bot.outputs.author }}
          PR: ${{ steps.pr.outputs.number }}
        run: node base/tools/pr-automation/finalize.mjs --repo head --pr "$PR" --author "$AUTHOR"
