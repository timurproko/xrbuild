schema: spec-driven

context: |
  The XR Build core and private development workspace are independent Git repositories. Authorized developers
  clone the workspace at the core checkout's ignored `.xrbuild/` path; it is not a submodule or junction. Ordinary
  users use `XRB_HOME`, else `%USERPROFILE%\.xrbuild`. Core CI requires no private workspace credentials or assets. Never use a
  proprietary name (a vendor, product or SDK, client, person, or where code came from) in core artifacts, paths
  outside `.xrbuild/`, proposals, designs, specs, tasks, examples or scenario data. Describe roles instead
  ("a 3D display", "a hand tracker", "a station platform") and use made-up example names (`stereo-panel`, `tracker`,
  `station`). The entire private `.xrbuild/` workspace is exempt from the core name guard; its plugin, project and
  pinned Git LFS dependency paths may use external names. Do not export that clone or its history publicly.
  Audited, explicitly approved public integrations may live in core-owned `embedded/plugins/` and projects in
  `embedded/projects/<section>/<id>/`; embedded is not another Git repository. Embedded and selected user
  workspaces share manifest/layout contracts. The engine remains generic; concrete modules use neutral plugin
  contracts. User configuration/state stays in the selected writable workspace. Public promotion requires an
  exact reviewed source/asset allowlist, confidentiality/license checks and separate export approval; no private
  ancestry is imported. `pnpm check:names` must pass. Task repository routing/provisioning and tested-revision
  records use ignored local artifacts; core/embedded-only work needs no private clone, private-only work needs
  no empty public PR, and paired work retains separate owners. Local checks grant no commit/push/hosting or
  cleanup authority. Active predecessor spec deltas synchronize in their recorded order through the repo bot.
  A missing canonical baseline after an accepted public bootstrap may use an explicitly maintainer-approved
  contract-only checkpoint as described in docs/spec-baseline-reconciliation.md. Review relevant predecessor
  contracts in their recorded order, bind them to accepted public implementation evidence, and leave historical
  plans/tasks unchanged. Its own complete tasks and normal bot finalization remain required; successors stay
  blocked until the checkpoint is bot-finalized and maintainer-merged. No private export or hosting authority follows.
  Repository delivery policy: docs/delivery-rules.md using only the xrbuild entry in docs/delivery-adapters.json.
  Repository command details: .claude/skills/change-delivery/SKILL.md. OpenSpec remains unchanged; its skills,
  generated commands, schemas, templates and lifecycle are not overridden by this repository context.
